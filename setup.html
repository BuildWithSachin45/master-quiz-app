<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configure Quiz - Master Quiz</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/style.css">
</head>
<body class="bg-light min-vh-100 d-flex flex-column">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3 text-primary d-flex align-items-center gap-2" href="index.html">
                <i class="bi bi-patch-question-fill text-warning"></i>
                <span>Master Quiz</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-2">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#home">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#about">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#categories">Categories</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#contact">Contact Me</a>
                    </li>
                    <li class="nav-item ms-lg-2">
                        <a class="btn btn-outline-light px-3 rounded-pill fw-semibold" href="index.html">Exit</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Setup Container -->
    <main class="container my-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                    <div class="card-header bg-primary text-white p-4 border-0">
                        <div class="d-flex align-items-center gap-3">
                            <div class="rounded-circle bg-white text-primary d-flex align-items-center justify-content-center" style="width: 48px; height: 48px; font-size: 1.5rem;">
                                <i class="bi bi-sliders"></i>
                            </div>
                            <div>
                                <h3 class="fw-bold mb-1">Configure Your Quiz</h3>
                                <p class="mb-0 text-white-50 small">Customize your game mode, players, challenge level, and question pool.</p>
                            </div>
                        </div>
                    </div>

                    <div class="card-body p-4 p-md-5 bg-white">
                        <form id="quiz-setup-form">
                            
                            <!-- Game Mode Selection -->
                           <!-- Game Mode Selection -->
<div class="mb-4">
    <label class="form-label fw-bold text-dark">
        <i class="bi bi-controller text-primary me-1"></i> Select Game Mode
    </label>
    <div class="row g-2">
        <div class="col-6">
            <input type="radio" class="btn-check" name="gameMode" id="mode-single" value="single" checked autocomplete="off">
            <label class="btn btn-outline-primary w-100 h-100 py-3 rounded-3 fw-semibold text-center d-flex flex-column justify-content-center align-items-center" for="mode-single">
                <i class="bi bi-person fs-3 mb-1"></i>
                <span>Solo Player</span>
            </label>
        </div>
        <div class="col-6">
            <input type="radio" class="btn-check" name="gameMode" id="mode-multi" value="multi" autocomplete="off">
            <label class="btn btn-outline-primary w-100 h-100 py-3 rounded-3 fw-semibold text-center d-flex flex-column justify-content-center align-items-center" for="mode-multi">
                <i class="bi bi-people fs-3 mb-1"></i>
                <span>2-Player Pass & Play</span>
            </label>
        </div>
    </div>
</div>

                            <!-- User Names -->
                            <div class="row g-3 mb-4">
                                <div class="col-12" id="player1-wrapper">
                                    <label for="username" class="form-label fw-bold text-dark" id="player1-label">
                                        <i class="bi bi-person-fill text-primary me-1"></i> Your Name
                                    </label>
                                    <input type="text" class="form-control form-control-lg rounded-3" id="username" name="username" placeholder="Player 1 Name" required>
                                </div>
                                <div class="col-12 d-none" id="player2-wrapper">
                                    <label for="username2" class="form-label fw-bold text-dark">
                                        <i class="bi bi-person-fill text-warning me-1"></i> Player 2 Name
                                    </label>
                                    <input type="text" class="form-control form-control-lg rounded-3" id="username2" name="username2" placeholder="Player 2 Name">
                                </div>
                            </div>

                            <!-- Random Topics Checkbox -->
                            <div class="mb-4">
                                <div class="form-check form-switch p-3 bg-light rounded-3 border">
                                    <input class="form-check-input ms-0 me-3" type="checkbox" role="switch" id="random-topics">
                                    <label class="form-check-label fw-semibold text-dark" for="random-topics">
                                        Select Random Topics <span class="text-muted fw-normal">(Pulls a balanced mix across all domains)</span>
                                    </label>
                                </div>
                            </div>

                            <!-- Category Selection Section -->
                            <div class="mb-4" id="categories-section">
                                <label class="form-label fw-bold text-dark d-flex justify-content-between align-items-center">
                                    <span><i class="bi bi-collection-fill text-primary me-1"></i> Select Subcategories</span>
                                    <span class="badge bg-secondary-subtle text-secondary small fw-normal">Multi-select enabled</span>
                                </label>
                                <div id="selected-chips" class="d-flex flex-wrap gap-2 mb-3"></div>
                                <div class="accordion border rounded-3 overflow-hidden shadow-sm" id="category-accordion"></div>
                            </div>

                            <!-- Difficulty Selection -->
                            <div class="mb-4">
                                <label class="form-label fw-bold text-dark">
                                    <i class="bi bi-reception-4 text-primary me-1"></i> Difficulty Level
                                </label>
                                <div class="row g-2">
                                    <div class="col-6 col-md-3">
                                        <input type="radio" class="btn-check" name="difficulty" id="diff-easy" value="easy" autocomplete="off">
                                        <label class="btn btn-outline-success w-100 py-2 rounded-3 fw-semibold" for="diff-easy">
                                            <i class="bi bi-emoji-smile d-block fs-5 mb-1"></i> Easy
                                        </label>
                                    </div>
                                    <div class="col-6 col-md-3">
                                        <input type="radio" class="btn-check" name="difficulty" id="diff-medium" value="medium" autocomplete="off">
                                        <label class="btn btn-outline-warning w-100 py-2 rounded-3 fw-semibold" for="diff-medium">
                                            <i class="bi bi-lightning-charge d-block fs-5 mb-1"></i> Medium
                                        </label>
                                    </div>
                                    <div class="col-6 col-md-3">
                                        <input type="radio" class="btn-check" name="difficulty" id="diff-hard" value="hard" autocomplete="off">
                                        <label class="btn btn-outline-danger w-100 py-2 rounded-3 fw-semibold" for="diff-hard">
                                            <i class="bi bi-fire d-block fs-5 mb-1"></i> Hard
                                        </label>
                                    </div>
                                    <div class="col-6 col-md-3">
                                        <input type="radio" class="btn-check" name="difficulty" id="diff-all" value="all" autocomplete="off" checked>
                                        <label class="btn btn-outline-primary w-100 py-2 rounded-3 fw-semibold" for="diff-all">
                                            <i class="bi bi-shuffle d-block fs-5 mb-1"></i> All (Mixed)
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <!-- Number of Questions Selection -->
                            <div class="mb-4">
                                <label for="num-questions" class="form-label fw-bold text-dark">
                                    <i class="bi bi-123 text-primary me-1"></i> Number of Questions
                                </label>
                                <select class="form-select form-select-lg rounded-3" id="num-questions" name="numQuestions">
                                    <option value="10" selected>10 Questions</option>
                                    <option value="20">20 Questions</option>
                                    <option value="30">30 Questions</option>
                                    <option value="40">40 Questions</option>
                                    <option value="50">50 Questions</option>
                                    <option value="custom">Custom Count...</option>
                                </select>
                            </div>

                            <!-- Custom Question Count Input -->
                            <div class="mb-4 d-none" id="custom-questions-group">
                                <label for="custom-questions" class="form-label fw-bold text-dark">
                                    <i class="bi bi-pencil-square text-primary me-1"></i> Enter Custom Question Count
                                </label>
                                <input type="number" class="form-control form-control-lg rounded-3" id="custom-questions" name="customQuestions" min="1" max="500" placeholder="e.g., 25">
                            </div>

                            <!-- Submit Button -->
                            <div class="d-grid mt-5">
                                <button type="submit" id="start-btn" class="btn btn-primary btn-lg rounded-pill fw-bold py-3 shadow">
                                    <i class="bi bi-play-fill fs-5 align-middle me-1"></i> Launch Assessment
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark py-4 text-white border-top border-secondary mt-auto">
        <div class="container text-center">
            <p class="mb-0 small text-white-50">
                All rights reserved with BuildwithSachin45
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/script.js"></script>
</body>
</html>
